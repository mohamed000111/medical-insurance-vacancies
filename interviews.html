<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Experiences · MedInsure Hub</title>
  <meta name="description" content="Share and discover interview questions and experiences for medical insurance jobs in Egypt." />
  <meta property="og:title" content="Interview Experiences · MedInsure Hub" />
  <meta property="og:description" content="Interview questions and mockups for medical insurance professionals." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://amwesufvpwxxyhgagicy.supabase.co/storage/v1/object/public/assets/hero.jpg" />
  <meta name="theme-color" content="#050b16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232dd4bf'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%2304131f' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body data-title-key="intTitle">
  <div class="bg-scene" aria-hidden="true"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

  <header id="site-header" class="sticky top-0 z-50 px-4 pt-4"></header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 pb-20">
    <section class="pt-14 pb-10 reveal">
      <span class="chip"><span class="pulse-dot"></span><span data-i18n="navInterviews"></span></span>
      <h1 class="mt-5 text-4xl sm:text-5xl font-extrabold tracking-tight"><span class="text-gradient" data-i18n="intTitle"></span></h1>
      <p class="mt-3 text-slate-400 text-lg" data-i18n="intSub"></p>
    </section>

    <div class="grid lg:grid-cols-5 gap-8 items-start">
      <!-- Submission form -->
      <aside class="lg:col-span-2 lg:sticky lg:top-28 reveal">
        <form id="interview-form" class="glass-card glow-border p-6 sm:p-7 space-y-5" novalidate>
          <h2 class="text-xl font-bold flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl grid place-items-center bg-gradient-to-br from-violet-400 to-sky-400 text-slate-950">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="w-5 h-5"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </span>
            <span data-i18n="intFormTitle"></span>
          </h2>

          <div>
            <label for="company-name" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="companyLabel"></label>
            <input id="company-name" name="company_name" type="text" maxlength="100" required autocomplete="organization" list="company-list" dir="auto" class="field" data-i18n-ph="companyPh" />
            <datalist id="company-list"></datalist>
          </div>

          <div>
            <label for="position" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="positionLabel"></label>
            <input id="position" name="position" type="text" maxlength="100" required dir="auto" class="field" data-i18n-ph="positionPh" />
          </div>

          <div>
            <label for="topics" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="topicsLabel"></label>
            <textarea id="topics" name="topics" rows="4" maxlength="2000" required dir="auto" class="field resize-y min-h-24" data-i18n-ph="topicsPh"></textarea>
          </div>
          
          <div>
            <label for="pdf-link" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="pdfLabel"></label>
            <input id="pdf-link" name="pdf_link" type="file" accept=".pdf,.doc,.docx,image/*" dir="auto" class="field file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-400/10 file:text-teal-300 hover:file:bg-teal-400/20" />
          </div>

          <div class="pt-4 border-t border-white/5 space-y-4">
            <h3 class="text-sm font-semibold text-teal-300" data-i18n="hrCreditTitle"></h3>
            <div>
              <label for="hr-name" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="hrNameLabel"></label>
              <input id="hr-name" name="hr_name" type="text" maxlength="60" dir="auto" class="field" data-i18n-ph="hrNamePh" />
            </div>
            <div>
              <label for="hr-phone" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="hrPhoneLabel"></label>
              <input id="hr-phone" name="hr_phone" type="text" maxlength="60" dir="auto" class="field" data-i18n-ph="hrPhonePh" />
            </div>
            <div>
              <label for="hr-email" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="hrEmailLabel"></label>
              <input id="hr-email" name="hr_email" type="email" maxlength="100" dir="auto" class="field" data-i18n-ph="hrEmailPh" />
            </div>
          </div>

          <!-- honeypot -->
          <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off" /></div>

          <button id="submit-interview" type="submit" class="btn-primary w-full !py-3 text-base" data-i18n="submit"></button>
        </form>
      </aside>

      <!-- Feed -->
      <section class="lg:col-span-3" aria-labelledby="feed-title">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
          <h2 id="feed-title" class="text-xl font-bold" data-i18n="feedIntTitle"></h2>
          <div class="relative flex-1 sm:max-w-xs">
            <span class="absolute inset-y-0 start-3 flex items-center text-slate-500 pointer-events-none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input id="interview-search" type="search" autocomplete="off" class="field !ps-9 !py-2 text-sm glass-bar" data-i18n-ph="intSearchPh" />
          </div>
        </div>
        <div id="interview-feed" class="space-y-4" aria-live="polite"></div>
        <div class="mt-8 flex justify-center">
          <button id="load-more-interview" type="button" class="btn-ghost !px-8 !py-3 hidden" data-i18n="loadMore"></button>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="border-t border-white/5"></footer>

  <script type="module">
    import { initShell } from "./assets/js/ui.js";
    initShell("interviews");
    import("./assets/js/interviews.js");
  </script>
</body>
</html>
