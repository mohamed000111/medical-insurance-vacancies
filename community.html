<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Board · MedInsure Hub</title>
  <meta name="description" content="Professional Q&A and discussions for medical insurance specialists in Egypt. Ask questions, share experience, and connect with peers." />
  <meta property="og:title" content="Medical Insurance Community · MedInsure Hub" />
  <meta property="og:description" content="Q&A and discussions for medical insurance professionals in Egypt." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://amwesufvpwxxyhgagicy.supabase.co/storage/v1/object/public/assets/hero.jpg" />
  <meta name="theme-color" content="#050b16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232dd4bf'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%2304131f' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body data-title-key="comTitle">
  <div class="bg-scene" aria-hidden="true"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

  <header id="site-header" class="sticky top-0 z-50 px-4 pt-4"></header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 pb-20">
    <section class="pt-14 pb-10 reveal">
      <span class="chip"><span class="pulse-dot"></span><span data-i18n="navCommunity"></span></span>
      <h1 class="mt-5 text-4xl sm:text-5xl font-extrabold tracking-tight"><span class="text-gradient" data-i18n="comTitle"></span></h1>
      <p class="mt-3 text-slate-400 text-lg" data-i18n="comSub"></p>
    </section>

    <div class="grid lg:grid-cols-5 gap-8 items-start">
      <!-- Submission form -->
      <aside class="lg:col-span-2 lg:sticky lg:top-28 reveal">
        <form id="community-form" class="glass-card glow-border p-6 sm:p-7 space-y-5" novalidate>
          <h2 class="text-xl font-bold flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl grid place-items-center bg-gradient-to-br from-violet-400 to-sky-400 text-slate-950">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="w-5 h-5"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </span>
            <span data-i18n="formTitle"></span>
          </h2>

          <div>
            <label for="author-name" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="nameLabel"></label>
            <input id="author-name" name="author_name" type="text" maxlength="60" required autocomplete="name" dir="auto" class="field" data-i18n-ph="namePh" />
          </div>

          <div>
            <label for="message" class="block text-sm font-medium text-slate-300 mb-2" data-i18n="msgLabel"></label>
            <textarea id="message" name="message" rows="6" maxlength="2000" required dir="auto" class="field resize-y min-h-36" data-i18n-ph="msgPh"></textarea>
            <div class="mt-2 flex justify-between text-xs text-slate-500">
              <span data-i18n="guidelines"></span>
              <span id="char-count" class="tabular-nums shrink-0 ms-3">0 / 2000</span>
            </div>
          </div>

          <!-- honeypot (hidden from humans) -->
          <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off" /></div>

          <button id="submit-post" type="submit" class="btn-primary w-full !py-3 text-base" data-i18n="submit"></button>
        </form>
      </aside>

      <!-- Feed -->
      <section class="lg:col-span-3" aria-labelledby="feed-title">
        <h2 id="feed-title" class="text-xl font-bold mb-5" data-i18n="feedTitle"></h2>
        <div id="community-feed" class="space-y-4" aria-live="polite"></div>
        <div class="mt-8 flex justify-center">
          <button id="load-more-community" type="button" class="btn-ghost !px-8 !py-3 hidden" data-i18n="loadMore"></button>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="border-t border-white/5"></footer>

  <script type="module">
    import { initShell } from "./assets/js/ui.js";
    initShell("community");
    import("./assets/js/community.js");
  </script>
</body>
</html>
