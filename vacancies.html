<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacancies Billboard · MedInsure Hub</title>
  <meta name="description" content="Browse the latest medical insurance job vacancies in Cairo & Egypt · claims, approvals, medical network and call center roles, posted live from Telegram." />
  <meta property="og:title" content="Medical Insurance Vacancies · MedInsure Hub" />
  <meta property="og:description" content="Latest medical insurance job openings in Egypt, updated live." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://amwesufvpwxxyhgagicy.supabase.co/storage/v1/object/public/assets/hero.jpg" />
  <meta name="theme-color" content="#050b16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232dd4bf'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%2304131f' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body data-title-key="vacTitle">
  <div class="bg-scene" aria-hidden="true"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

  <header id="site-header" class="sticky top-0 z-50 px-4 pt-4"></header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 pb-20">
    <section class="pt-14 pb-8 reveal">
      <span class="chip"><span class="pulse-dot"></span><span data-i18n="heroBadge"></span></span>
      <div class="mt-5 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight"><span class="text-gradient" data-i18n="vacTitle"></span></h1>
          <p class="mt-3 text-slate-400 text-lg" data-i18n="vacSub"></p>
        </div>
        <span id="result-count" class="text-sm text-slate-500"></span>
      </div>

      <label for="vacancy-search" class="sr-only" data-i18n="searchPh"></label>
      <div class="mt-8 relative">
        <span class="absolute inset-y-0 start-4 flex items-center text-slate-500 pointer-events-none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="vacancy-search" type="search" autocomplete="off" class="field !ps-12 !py-4 text-base glass-bar" data-i18n-ph="searchPh" />
      </div>
    </section>

    <section id="vacancy-list" aria-live="polite" class="grid md:grid-cols-2 gap-5 items-stretch"></section>

    <div class="mt-10 flex justify-center">
      <button id="load-more" type="button" class="btn-ghost !px-8 !py-3 hidden" data-i18n="loadMore"></button>
    </div>
  </main>

  <footer id="site-footer" class="border-t border-white/5"></footer>

  <script type="module">
    import { initShell } from "./assets/js/ui.js";
    initShell("vacancies");
    import("./assets/js/vacancies.js");
  </script>
</body>
</html>
