<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacancies Billboard · MedInsure Hub</title>
  <meta name="description" content="Browse the latest medical insurance job vacancies in Cairo & Egypt · claims, approvals, medical network and call center roles, posted live from Telegram." />
  <meta property="og:title" content="Medical Insurance Vacancies · MedInsure Hub" />
  <meta property="og:description" content="Latest medical insurance job openings in Egypt, updated live." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://amwesufvpwxxyhgagicy.supabase.co/storage/v1/object/public/assets/hero.jpg" />
  <meta name="theme-color" content="#050b16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232dd4bf'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%2304131f' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body data-title-key="vacTitle">
  <div class="bg-scene" aria-hidden="true"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

  <header id="site-header" class="sticky top-0 z-50 px-4 pt-4"></header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 pb-20">
    <section class="pt-14 pb-8 reveal">
      <span class="chip"><span class="pulse-dot"></span><span data-i18n="heroBadge"></span></span>
      <div class="mt-5 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight"><span class="text-gradient" data-i18n="vacTitle"></span></h1>
          <p class="mt-3 text-slate-400 text-lg" data-i18n="vacSub"></p>
        </div>
        <span id="result-count" class="text-sm text-slate-500"></span>
      </div>

      <label for="vacancy-search" class="sr-only" data-i18n="searchPh"></label>
      <div class="mt-8 relative">
        <span class="absolute inset-y-0 start-4 flex items-center text-slate-500 pointer-events-none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="vacancy-search" type="search" autocomplete="off" class="field !ps-12 !py-4 text-base glass-bar" data-i18n-ph="searchPh" />
      </div>
    </section>

    <section id="vacancy-list" aria-live="polite" class="grid md:grid-cols-2 gap-5 items-stretch"></section>

    <div class="mt-10 flex justify-center">
      <button id="load-more" type="button" class="btn-ghost !px-8 !py-3 hidden" data-i18n="loadMore"></button>
    </div>

    <!-- CV Submission Modal -->
    <div id="cv-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="cv-modal-title">
      <div class="modal-dialog">
        <!-- Header -->
        <div class="p-5 border-b border-white/10 flex items-center justify-between gap-3 bg-slate-900/60">
          <div class="flex items-center gap-3">
            <span class="w-9 h-9 rounded-xl grid place-items-center bg-gradient-to-br from-emerald-400 to-teal-500 text-slate-950 font-bold shadow-md shadow-emerald-500/20">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="w-5 h-5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </span>
            <div>
              <h2 id="cv-modal-title" class="text-lg font-bold text-slate-100" data-i18n="submitCvModalTitle"></h2>
              <p class="text-xs text-slate-400" id="cv-modal-sub"></p>
            </div>
          </div>
          <button type="button" id="cv-modal-close" class="btn-ghost !p-2 !rounded-lg text-slate-400 hover:text-white" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Form -->
        <form id="cv-form" class="p-6 space-y-4 overflow-y-auto">
          <input type="hidden" id="cv-vacancy-id" name="vacancy_id" />

          <div>
            <label for="cv-name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="applicantNameLabel"></label>
            <input id="cv-name" name="applicant_name" type="text" required maxlength="100" dir="auto" class="field !py-2.5 !text-sm" data-i18n-ph="applicantNamePh" />
          </div>

          <div class="grid sm:grid-cols-2 gap-3">
            <div>
              <label for="cv-phone" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="applicantPhoneLabel"></label>
              <input id="cv-phone" name="applicant_phone" type="tel" required maxlength="30" dir="ltr" class="field !py-2.5 !text-sm" data-i18n-ph="applicantPhonePh" />
            </div>
            <div>
              <label for="cv-email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="applicantEmailLabel"></label>
              <input id="cv-email" name="applicant_email" type="email" maxlength="100" dir="ltr" class="field !py-2.5 !text-sm" data-i18n-ph="applicantEmailPh" />
            </div>
          </div>

          <!-- File Upload Dropzone -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="cvFileLabel"></label>
            <div id="cv-dropzone" class="file-dropzone">
              <input type="file" id="cv-file-input" name="cv_file" accept=".pdf,.doc,.docx" required class="hidden" />
              <div id="cv-dropzone-content" class="flex flex-col items-center justify-center gap-1.5 text-slate-400">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-8 h-8 text-emerald-400 mb-1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span class="text-sm font-semibold text-slate-200" data-i18n="cvChooseFile"></span>
                <span class="text-xs text-slate-500" data-i18n="cvFileHint"></span>
              </div>
              <div id="cv-file-selected" class="hidden flex items-center justify-between gap-3 bg-emerald-500/10 border border-emerald-500/25 p-3 rounded-lg text-left rtl:text-right">
                <div class="flex items-center gap-2.5 min-w-0">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5 text-emerald-400 shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  <div class="min-w-0">
                    <p id="cv-filename" class="text-xs font-semibold text-slate-200 truncate"></p>
                    <p id="cv-filesize" class="text-[11px] text-slate-400 font-mono"></p>
                  </div>
                </div>
                <button type="button" id="cv-remove-file" class="text-slate-400 hover:text-rose-400 p-1 text-xs">✕</button>
              </div>
            </div>
          </div>

          <div>
            <label for="cv-note" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" data-i18n="cvNoteLabel"></label>
            <textarea id="cv-note" name="note" rows="2" maxlength="500" dir="auto" class="field !py-2 !text-sm resize-none" data-i18n-ph="cvNotePh"></textarea>
          </div>

          <!-- Submit Button -->
          <div class="pt-2 flex items-center gap-3">
            <button type="submit" id="cv-submit-btn" class="flex-1 btn-primary !py-3 !text-sm font-bold flex items-center justify-center gap-2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="w-4 h-4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span data-i18n="cvSubmitBtn"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="border-t border-white/5"></footer>

  <script type="module">
    import { initShell } from "./assets/js/ui.js";
    initShell("vacancies");
    import("./assets/js/vacancies.js");
  </script>
</body>
</html>
